name: 同步上游

# 每天把這個 fork 的預設分支，與上游儲存庫的預設分支對齊。
# 只呼叫 GitHub 的 merge-upstream API（POST /repos/{owner}/{repo}/merge-upstream），
# 使用工作流程自帶的 GITHUB_TOKEN，並要求 contents: write。
# 不 checkout、不執行 git push，因此不會 force-push，也不會改寫歷史。
# merge-upstream 只會快轉，或在無法快轉時建立合併提交；上游預設分支由 API 決定，無法改選其他分支。
# 衝突（HTTP 409）時讓這個工作流程失敗。若此儲存庫已開啟 Issues，會開一則 issue（已有相同主旨則改為留言）。

on:
  schedule:
    # 19:00 UTC = 臺北時間 03:00（臺灣無日光節約時間）。GitHub 排程可能稍晚才開始。
    - cron: '0 19 * * *'
  workflow_dispatch:

# 宣告任一權限後，其餘權限預設為 none。issues: write 只用於衝突時建立 issue。
permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 將上游預設分支合併進 fork 預設分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          write_summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          open_conflict_issue() {
            issue_title="上游同步衝突：無法將 ${parent} 合併到 ${branch}"
            issue_file=$(mktemp)
            {
              printf '%s\n' '<!-- upstream-sync-conflict -->'
              printf '%s\n' "此 fork \`${GITHUB_REPOSITORY}\` 的預設分支 \`${branch}\` 無法透過 merge-upstream API，與上游 [${parent}](https://github.com/${parent}) 的預設分支 \`${parent_branch}\` 合併（HTTP 409）。"
              printf '%s\n' ''
              printf '%s\n' '工作流程沒有 force-push，也沒有改寫歷史。請在本機以合併解決衝突，不要 force-push。'
              printf '%s\n' ''
              printf '%s\n' 'API 訊息：'
              printf '%s\n' ''
              printf '%s\n' '```text'
              printf '%s\n' "$message"
              printf '%s\n' '```'
              printf '%s\n' ''
              printf '%s\n' "執行紀錄：${run_url}"
            } > "$issue_file"

            existing=""
            page=1
            while true; do
              if ! batch=$(gh api "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&page=${page}"); then
                echo "::warning::無法列出既有 issue，會嘗試另外建立一則。"
                break
              fi
              count=$(printf '%s' "$batch" | jq 'length')
              found=$(printf '%s' "$batch" | jq -r '[.[] | select((.pull_request | not) and (.title | startswith("上游同步衝突："))) | .number] | first // empty')
              if [ -n "$found" ]; then
                existing=$found
                break
              fi
              if [ "$count" -lt 100 ] || [ "$page" -ge 20 ]; then
                break
              fi
              page=$((page + 1))
            done

            if [ -n "$existing" ]; then
              echo "已有開啟中的衝突 issue #${existing}，改為加上留言。"
              if ! gh issue comment "$existing" --body-file "$issue_file"; then
                echo "::warning::無法在 issue #${existing} 留言。"
              fi
            else
              echo "建立衝突 issue。"
              if ! gh issue create --title "$issue_title" --body-file "$issue_file"; then
                echo "::warning::無法建立衝突 issue。"
              fi
            fi
          }

          repo_json=$(gh api "/repos/${GITHUB_REPOSITORY}")
          branch=$(printf '%s' "$repo_json" | jq -r '.default_branch')
          parent=$(printf '%s' "$repo_json" | jq -r '.parent.full_name // empty')
          parent_branch=$(printf '%s' "$repo_json" | jq -r '.parent.default_branch // empty')
          has_issues=$(printf '%s' "$repo_json" | jq -r '.has_issues')

          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "::error::無法判斷此 fork 的預設分支。"
            exit 1
          fi

          if [ -z "$parent" ]; then
            echo "::error::${GITHUB_REPOSITORY} 不是 fork，無法使用 merge-upstream API。"
            exit 1
          fi

          echo "fork：${GITHUB_REPOSITORY} 預設分支 ${branch}"
          echo "上游：${parent} 預設分支 ${parent_branch}"
          echo "呼叫 merge-upstream。此步驟不會 checkout，也不會 git push 或 force-push。"

          body_file=$(mktemp)
          payload=$(jq -nc --arg branch "$branch" '{branch:$branch}')
          http_status=$(curl -sS --max-time 60 \
            -o "$body_file" \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream") || {
            echo "::error::無法連線到 merge-upstream API。"
            exit 1
          }

          echo "HTTP ${http_status}"
          cat "$body_file"
          echo

          message=$(jq -r '.message // empty' "$body_file" 2>/dev/null || true)
          merge_type=$(jq -r '.merge_type // empty' "$body_file" 2>/dev/null || true)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "$http_status" in
            2*)
              echo "同步成功：${message}（merge_type=${merge_type:-none}）"
              write_summary "## 上游同步完成" "" \
                "- Fork：\`${GITHUB_REPOSITORY}\` 的 \`${branch}\`" \
                "- 上游：\`${parent}\` 的 \`${parent_branch}\`" \
                "- 結果：${message}" \
                "- merge_type：${merge_type:-none}" \
                "- 方式：merge-upstream API（沒有 force-push）"
              ;;
            409)
              echo "::error::合併衝突，已停止。沒有 force-push。請在本機把上游 ${parent}:${parent_branch} 合併進 ${branch} 並解決衝突。"
              write_summary "## 上游同步失敗：合併衝突" "" \
                "- Fork：\`${GITHUB_REPOSITORY}\` 的 \`${branch}\`" \
                "- 上游：\`${parent}\` 的 \`${parent_branch}\`" \
                "- HTTP 409。沒有 force-push。" \
                "- 執行紀錄：${run_url}"
              if [ "$has_issues" != "true" ]; then
                echo "此儲存庫未開啟 Issues，略過建立 issue。同步仍視為失敗。"
                exit 1
              fi
              open_conflict_issue
              exit 1
              ;;
            403)
              echo "::error::GITHUB_TOKEN 權限不足（HTTP 403）。請到 Settings、Actions、General、Workflow permissions，將 GITHUB_TOKEN 設為 Read and write permissions。"
              write_summary "## 上游同步失敗：權限不足" "" \
                "- HTTP 403" \
                "- ${message}"
              exit 1
              ;;
            *)
              echo "::error::merge-upstream 失敗（HTTP ${http_status}）。${message}"
              write_summary "## 上游同步失敗" "" \
                "- HTTP ${http_status}" \
                "- ${message}"
              exit 1
              ;;
          esac
